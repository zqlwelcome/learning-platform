name: Update live hot news

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/update-live-hot-news.mjs
      - name: Commit live news
        run: |
          git config user.name "learning-news-bot"
          git config user.email "learning-news-bot@users.noreply.github.com"
          git add data/live-hot-news.json data/alerts.json
          git diff --cached --quiet || git commit -m "auto: 实时新闻源更新"
          git push
